name: wayland
description: >-
  A pure Dart Wayland client. Used by Pangolin to act as the river window
  manager and by dahliaOS applications that need to talk to the compositor.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  meta: ^1.9.0

dev_dependencies:
  lint: ^2.1.2
  test: ^1.24.0
  xml: ^6.3.0
