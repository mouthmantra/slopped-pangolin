name: dahlia_apps
description: >-
  The dahliaOS applications (Settings, Files, App Store, Clock, Welcome,
  Terminal, Calculator, Activity Monitor, Gallery, Text Editor and Logs),
  built as a single multi-call Flutter binary for the Pangolin desktop.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  collection: ^1.17.1
  dahlia_shared:
    git:
      url: https://github.com/dahliaOS/shared
      ref: main
  dbus: ^0.7.8
  dsettings:
    git: https://github.com/dahliaos/dsettings
  flutter_pty: ^0.4.2
  http: ^1.1.0
  intl: any
  jovial_svg: ^1.1.17
  logging: ^1.2.0
  mime: ^2.0.0
  display_config:
    path: ../packages/display_config
  system_controls:
    path: ../packages/system_controls
  pangolin_settings:
    path: ../packages/pangolin_settings
  path: ^1.8.2
  shared_preferences: ^2.2.0
  timezone: ^0.11.0
  upower: ^0.7.0
  url_launcher: ^6.1.3
  wayland:
    path: ../packages/wayland
  xdg_directories: ^1.0.3
  xterm: ^4.0.0
  yaru_window: ^0.1.3
  zenit_ui:
    path: ../packages/zenit_ui

dependency_overrides:
  # dahlia_shared/yatl pin intl ^0.19.0, the Flutter SDK requires ^0.20.3.
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  lint: ^2.1.2

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
