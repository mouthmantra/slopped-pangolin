name: pangolin
description: The Desktop Environment for dahliaOS
publish_to: "none" # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies: 
  animations: ^2.0.7
  #TODO change once the pub version is fixed
  cached_network_image:
    git:
      url: https://github.com/gauravmehta13/flutter_cached_network_image.git
      path: cached_network_image
  collection: ^1.17.1
  dahlia_shared:
    git: 
      url: https://github.com/dahliaOS/shared
      ref: main
  dbus: ^0.7.4
  ffi: ^2.1.0
  diffutil_dart: ^4.0.0
  flutter: 
    sdk: flutter
  flutter_localizations: 
    sdk: flutter
  gsettings: ^0.2.7
  http: ^1.1.0
  intl: any
  jovial_svg: ^1.1.17
  logging: ^1.0.2
  path: ^1.8.2
  system_controls:
    path: packages/system_controls
  pangolin_settings:
    path: packages/pangolin_settings
  display_config:
    path: packages/display_config
  pausable_timer: ^2.0.0+1
  provider: ^6.0.1
  shared_preferences: ^2.0.15
  stack_trace: ^1.11.0
  upower: ^0.7.0
  url_launcher: ^6.1.3
  utopia_wm: 
    git: 
      url: https://github.com/dahliaOS/utopia.git
      ref: utopia
  uuid: ^4.0.0
  wayland:
    path: packages/wayland
  xdg_desktop: 
    git: https://github.com/HrX03/xdg.dart
  xdg_directories: ^1.0.3
  yatl: 
    git: 
      url: https://github.com/HrX03/yatl
      path: yatl
  yatl_flutter: 
    git: 
      url: https://github.com/HrX03/yatl
      path: yatl_flutter
  yatl_gen: 
    git: 
      url: https://github.com/HrX03/yatl
      path: yatl_gen
  # Vendored fork of dahliaOS/zenit_ui (Version-0.0.12) with fixes for current
  # Flutter, slider divisions and the surfaceColor/foregroundColor helpers
  # Pangolin was written against. See packages/zenit_ui/CHANGELOG.md.
  zenit_ui:
    path: packages/zenit_ui


dev_dependencies: 
  build_runner: ^2.4.4
  flutter_test:
    sdk: flutter
  lint: ^2.1.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/logos/
    - assets/images/other/
    - assets/images/wallpapers/
    - assets/textures/
    - assets/fonts/
  fonts:
    - family: CustomIcons
      fonts:
        - asset: assets/fonts/CustomIcons.ttf

dependency_overrides:
  # yatl still pins intl ^0.19.0 while flutter_localizations requires ^0.20.3.
  intl: ^0.20.3
