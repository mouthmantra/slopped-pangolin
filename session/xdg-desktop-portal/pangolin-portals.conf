#
# Desktop portals for Pangolin sessions (XDG_CURRENT_DESKTOP=Pangolin).
# Screen capture goes through xdg-desktop-portal-wlr, which speaks river's
# screencopy protocols; file choosers and "Open With" through Pangolin's own
# (session/portal), with GTK's as the fallback; everything else through the
# GTK portal.

[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.Secret=gnome-keyring
org.freedesktop.impl.portal.FileChooser=pangolin;gtk
org.freedesktop.impl.portal.AppChooser=pangolin;gtk
